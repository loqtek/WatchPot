# Standalone MySQL 8 for local/lab setup (watchPot setup wizard).
# Bound to loopback port 3307. Password is POSTGRES_PASSWORD from the repo-root .env
# (same secret the Postgres helper uses; ./setup generates it).

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_USER: watchpot
      MYSQL_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repo-root .env}
      MYSQL_DATABASE: watchpot
      MYSQL_ROOT_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repo-root .env}
    ports:
      - "127.0.0.1:${WATCHPOT_MYSQL_PORT:-3307}:3306"
    volumes:
      - watchpot_setup_mysql:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

volumes:
  watchpot_setup_mysql:
