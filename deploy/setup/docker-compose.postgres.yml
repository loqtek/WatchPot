# Standalone Postgres for local/lab setup (watchPot setup wizard).
# Bound to loopback port 5433 so it does not clash with a local PostgreSQL on 5432
# and is not reachable from other machines. Password comes from the repo-root .env
# (./setup generates one). Postgres applies POSTGRES_PASSWORD only on first init.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchpot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repo-root .env}
      POSTGRES_DB: watchpot
    ports:
      - "127.0.0.1:${WATCHPOT_POSTGRES_PORT:-5433}:5432"
    volumes:
      - watchpot_setup_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchpot -d watchpot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  watchpot_setup_pg:
